name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run irrelevant, so cancel it
# rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        working-directory: server
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: server
        # The suite runs without a Docker daemon and without an API key: the
        # mock AI provider is the default, and the execution tests assert the
        # container arguments against a fake Docker client rather than starting
        # a real container.
        env:
          EXECUTION_BACKEND: local
          SECRET_KEY: ci-test-key
        run: pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck and build
        working-directory: client
        # `npm run build` runs `tsc -b` first, so a type error fails the job.
        run: npm run build

  contract:
    name: API contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: pip install -r requirements.txt

      - name: Check the committed OpenAPI spec matches the code
        working-directory: server
        # docs/api/openapi.json is published as the contract. If it drifts from
        # what the app actually serves, the documentation is worse than absent -
        # it is confidently wrong.
        env:
          SECRET_KEY: ci-test-key
          EXECUTION_BACKEND: disabled
        run: |
          python - <<'PY'
          import json
          import sys

          from app.main import app

          with open("../docs/api/openapi.json", encoding="utf-8") as handle:
              committed = json.load(handle)

          live = json.loads(json.dumps(app.openapi()))

          if committed != live:
              committed_paths = set(committed["paths"])
              live_paths = set(live["paths"])

              print("The committed OpenAPI spec is out of date.")
              print("  Only in the committed spec:", sorted(committed_paths - live_paths))
              print("  Only in the running app:  ", sorted(live_paths - committed_paths))
              print()
              print("Regenerate it with the snippet in docs/api/README.md.")
              sys.exit(1)

          print(f"Contract matches: {len(live['paths'])} paths.")
          PY
