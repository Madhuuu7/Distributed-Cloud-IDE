version: '3.9'
services:
  backend:
    build:
      context: ./server
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=dev-secret-key
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - DB_PATH=/app/data/app.db
    volumes:
      - ./server:/app

  frontend:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./client:/app
