services:
  backend:
    build:
      context: ./server
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=dev-secret-key
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - DB_PATH=/app/data/app.db
      - CORS_ORIGINS=http://localhost:5173
      - EXECUTION_BACKEND=docker
    volumes:
      - ./server:/app
      - backend-data:/app/data
      # The API spawns sibling containers to run user code, so it needs the
      # daemon socket. This grants the API host-level Docker control - acceptable
      # for local development, but in production this belongs behind a dedicated
      # execution worker rather than the public-facing API.
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend-data:
